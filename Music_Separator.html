html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 'Instrument Sans',system-ui,sans-serif}

.dz.over,.dz:hover{border-color:var(--ac);background:#1a2028}

.how b{display:block;font-weight:600;margin-bottom:3px}

.panel{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}

h3{margin:0;font:600 14px 'Instrument Sans',sans-serif}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu)}
select{background:var(--in);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:8px;font:inherit}
.btn{font:600 13px 'Instrument Sans',sans-serif;border:1px solid var(--bb);background:var(--bt);color:var(--ink);padding:10px 14px;border-radius:6px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ai)}
.wide{width:100%}
.lnk{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;padding:0;flex:none}

.pbar{height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ac);width:0;transition:width .15s}
.pbar i.ind{width:35%;transition:none;animation:sl 1.1s ease-in-out infinite alternate}

<script>
/*DSP*/
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function makeFFT(n){
  const lv=Math.round(Math.log2(n)),cs=new Float64Array(n/2),sn=new Float64Array(n/2),rev=new Uint32Array(n);
  for(let i=0;i<n/2;i++){cs[i]=Math.cos(2*Math.PI*i/n);sn[i]=Math.sin(2*Math.PI*i/n);}
  for(let i=0;i<n;i++){let r=0,x=i;for(let j=0;j<lv;j++){r=(r<<1)|(x&1);x>>=1;}rev[i]=r;}
  return function(re,im){
    for(let i=0;i<n;i++){const j=rev[i];if(j>i){let a=re[i];re[i]=re[j];re[j]=a;a=im[i];im[i]=im[j];im[j]=a;}}
    for(let size=2;size<=n;size<<=1){
      const half=size>>1,step=n/size;
      for(let i=0;i<n;i+=size){
        for(let j=i,k=0;j<i+half;j++,k+=step){
          const l=j+half,tr=re[l]*cs[k]+im[l]*sn[k],ti=-re[l]*sn[k]+im[l]*cs[k];
          re[l]=re[j]-tr;im[l]=im[j]-ti;re[j]+=tr;im[j]+=ti;
        }
      }
    }
  };
}
function peakOf(a){let p=0;for(let i=0;i<a.length;i++){const x=a[i]<0?-a[i]:a[i];if(x>p)p=x;}return p;}
function fit(arrs,maxGain){
  let p=0;arrs.forEach(a=>{p=Math.max(p,peakOf(a));});
  const g=p>0?Math.min(maxGain,0.92/p):1;
  if(g!==1)arrs.forEach(a=>{for(let i=0;i<a.length;i++)a[i]*=g;});
}
const tick=(()=>{const ch=new MessageChannel(),q=[];ch.port1.onmessage=()=>{const f=q.shift();if(f)f();};return()=>new Promise(r=>{q.push(r);ch.port2.postMessage(0);});})();
function fail(key){const e=new Error(key);e.key=key;return e;}
async function separate(L,R,sr,mode,onP){
  const n=L.length;let em=0,es=0;
  for(let i=0;i<n;i++){const m=L[i]+R[i],s=L[i]-R[i];em+=m*m;es+=s*s;}
  if(em+es<1e-6)throw fail('eSil');
  if(es<=em*1e-6)throw fail('eMono');
  const v=new Float32Array(n),mL=new Float32Array(n),mR=new Float32Array(n);
  if(mode==='fast'){
    for(let i=0;i<n;i++){v[i]=(L[i]+R[i])/2;const s=(L[i]-R[i])/2;mL[i]=s;mR[i]=s;}
    fit([v],8);fit([mL,mR],8);
    if(onP)onP(1);
    return{vocal:[v],music:[mL,mR]};
  }
  const N=4096,H=1024,fft=makeFFT(N),nb=N/2+1;
  const win=new Float32Array(N),bw=new Float32Array(nb);
  for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  for(let k=0;k<nb;k++){const f=k*sr/N;bw[k]=clamp((f-60)/60,0,1)*clamp((12000-f)/3000,0,1);}
  const re=new Float32Array(N),im=new Float32Array(N),oR=new Float32Array(N),oI=new Float32Array(N);
  const total=Math.ceil((n+N-H)/H);let fr=0;
  for(let s=-(N-H);s<n;s+=H,fr++){
    for(let i=0;i<N;i++){const j=s+i,ok=j>=0&&j<n;re[i]=ok?L[j]*win[i]:0;im[i]=ok?R[j]*win[i]:0;}
    fft(re,im);
    for(let k=0;k<=N/2;k++){
      const k2=(N-k)&(N-1),Xr=re[k],Xi=im[k],Yr=re[k2],Yi=im[k2];
      const Lr=(Xr+Yr)/2,Li=(Xi-Yi)/2,Rr=(Xi+Yi)/2,Ri=(Yr-Xr)/2;
      const Mr=(Lr+Rr)/2,Mi=(Li+Ri)/2,Sr=(Lr-Rr)/2,Si=(Li-Ri)/2;
      const pm=Mr*Mr+Mi*Mi,c=pm/(pm+Sr*Sr+Si*Si+1e-12),x=clamp((c-0.6)/0.35,0,1),g=x*x*(3-2*x)*bw[k];
      const Vr=Mr*g,Vi=Mi*g;
      oR[k]=Vr;oI[k]=Vi;
      if(k>0&&k<N/2){oR[N-k]=Vr;oI[N-k]=-Vi;}
    }
    oI[0]=0;oI[N/2]=0;
    fft(oI,oR);
    for(let i=0;i<N;i++){const j=s+i;if(j>=0&&j<n)v[j]+=oR[i]/N*win[i];}
    if((fr&31)===0){if(onP)onP(Math.min(1,fr/total));await tick();}
  }
  for(let i=0;i<n;i++){v[i]/=1.5;mL[i]=L[i]-v[i];mR[i]=R[i]-v[i];}
  fit([v],1);fit([mL,mR],1);
  if(onP)onP(1);
  return{vocal:[v],music:[mL,mR]};
}
function wav(chs,sr){
  const n=chs[0].length,c=chs.length,b=new ArrayBuffer(44+n*c*2),d=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');d.setUint32(4,36+n*c*2,true);w(8,'WAVE');w(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,c,true);d.setUint32(24,sr,true);d.setUint32(28,sr*c*2,true);d.setUint16(32,c*2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*c*2,true);
  let o=44;
  for(let i=0;i<n;i++)for(let k=0;k<c;k++){const s=clamp(chs[k][i],-1,1);d.setInt16(o,s<0?s*32768:s*32767,true);o+=2;}
  return new Blob([b],{type:'audio/wav'});
}
/* ---------- AI: UVR MDX-Net (onnxruntime-web) ---------- */
function makeBlu(n){
  let M=1;while(M<2*n-1)M<<=1;
  const f=makeFFT(M),wr=new Float64Array(n),wi=new Float64Array(n),br=new Float64Array(M),bi=new Float64Array(M),ar=new Float64Array(M),ai=new Float64Array(M);
  for(let k=0;k<n;k++){const a=Math.PI*((k*k)%(2*n))/n;wr[k]=Math.cos(a);wi[k]=-Math.sin(a);br[k]=wr[k];bi[k]=-wi[k];if(k>0){br[M-k]=br[k];bi[M-k]=bi[k];}}
  f(br,bi);
  return function(re,im){
    ar.fill(0);ai.fill(0);
    for(let k=0;k<n;k++){ar[k]=re[k]*wr[k]-im[k]*wi[k];ai[k]=re[k]*wi[k]+im[k]*wr[k];}
    f(ar,ai);
    for(let k=0;k<M;k++){const x=ar[k]*br[k]-ai[k]*bi[k],y=ar[k]*bi[k]+ai[k]*br[k];ar[k]=x;ai[k]=y;}
    f(ai,ar);
    for(let k=0;k<n;k++){const cr=ar[k]/M,ci=ai[k]/M;re[k]=cr*wr[k]-ci*wi[k];im[k]=cr*wi[k]+ci*wr[k];}
  };
}
function mdxCore(nf,df,T,hop){
  const blu=makeBlu(nf),win=new Float64Array(nf),h=nf>>1,P=hop*(T-1),len=P+nf,env=new Float64Array(len);
  for(let i=0;i<nf;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/nf);
  for(let t=0;t<T;t++)for(let i=0;i<nf;i++)env[t*hop+i]+=win[i]*win[i];
  const re=new Float64Array(nf),im=new Float64Array(nf);
  const at=(a,j)=>{if(j<0)j=-j;else if(j>=P)j=2*(P-1)-j;return a[j];};
  return{
    stft(L,R){
      const x=new Float32Array(4*df*T);
      for(let t=0;t<T;t++){
        for(let i=0;i<nf;i++){const j=t*hop+i-h;re[i]=at(L,j)*win[i];im[i]=at(R,j)*win[i];}
        blu(re,im);
        for(let k=0;k<df;k++){
          const k2=(nf-k)%nf;
          x[k*T+t]=(re[k]+re[k2])/2;x[(df+k)*T+t]=(im[k]-im[k2])/2;
          x[(2*df+k)*T+t]=(im[k]+im[k2])/2;x[(3*df+k)*T+t]=(re[k2]-re[k])/2;
        }
      }
      return x;
    },
    istft(x){
      const oL=new Float64Array(len),oR=new Float64Array(len);
      for(let t=0;t<T;t++){
        re.fill(0);im.fill(0);
        for(let k=0;k<df;k++){
          const Ar=x[k*T+t],Ai=k?x[(df+k)*T+t]:0,Br=x[(2*df+k)*T+t],Bi=k?x[(3*df+k)*T+t]:0;
          re[k]=Ar-Bi;im[k]=Ai+Br;
          if(k>0){re[nf-k]=Ar+Bi;im[nf-k]=Br-Ai;}
        }
        blu(im,re);
        for(let i=0;i<nf;i++){oL[t*hop+i]+=re[i]/nf*win[i];oR[t*hop+i]+=im[i]/nf*win[i];}
      }
      const a=new Float32Array(P),b=new Float32Array(P);
      for(let j=0;j<P;j++){const e=env[h+j]>1e-10?env[h+j]:1;a[j]=oL[h+j]/e;b[j]=oR[h+j]/e;}
      return[a,b];
    }
  };
}
async function processAI(L,R,cfg,run,onP){
  const nf=cfg.nf,T=256,hop=1024,P=hop*(T-1),trim=nf>>1,gen=P-2*trim,n=L.length,core=mdxCore(nf,cfg.df,T,hop);
  const iL=new Float32Array(n),iR=new Float32Array(n),cl=new Float32Array(P),cr=new Float32Array(P),steps=Math.ceil(n/gen);
  for(let i=0,c=0;i<n;i+=gen,c++){
    for(let j=0;j<P;j++){const idx=i-trim+j,ok=idx>=0&&idx<n;cl[j]=ok?L[idx]:0;cr[j]=ok?R[idx]:0;}
    const out=await run(core.stft(cl,cr)),ab=core.istft(out),m=Math.min(gen,n-i);
    for(let j=0;j<m;j++){iL[i+j]=ab[0][trim+j]*cfg.comp;iR[i+j]=ab[1][trim+j]*cfg.comp;}
    if(onP)onP((c+1)/steps);
    await tick();
  }
  const vL=new Float32Array(n),vR=new Float32Array(n);
  for(let i=0;i<n;i++){vL[i]=L[i]-iL[i];vR[i]=R[i]-iR[i];}
  return{music:[iL,iR],vocal:[vL,vR]};
}
const CANDS=[[3072,6144],[3072,7680],[2560,5120],[2048,6144],[2048,5120]];
const MODEL_URLS=['https://huggingface.co/Politrees/UVR_resources/resolve/b9cd581f1d7826c6f4ccd4923d2c9f03ae3017d7/MDXNet_models/UVR-MDX-NET-Inst_HQ_5.onnx','https://huggingface.co/aae2kmitl/kotube-models/resolve/main/separation/UVR-MDX-NET-Inst_HQ_5.onnx'];
async function pickCfg(mk,L,R){
  const T=256,hop=1024,P=hop*(T-1),pl=new Float32Array(P),pr=new Float32Array(P),s0=Math.max(0,Math.floor(L.length/2-P/2));
  pl.set(L.subarray(s0,s0+P));pr.set(R.subarray(s0,s0+P));
  let best=null;
  for(const[df,nf]of CANDS){
    try{
      const core=mdxCore(nf,df,T,hop),a=core.istft(await mk(df)(core.stft(pl,pr)))[0],tr=nf>>1;
      let sxy=0,sxx=0,syy=0;
      for(let j=tr;j<P-tr;j++){sxy+=a[j]*pl[j];sxx+=pl[j]*pl[j];syy+=a[j]*a[j];}
      const c=sxy/Math.sqrt(sxx*syy+1e-20);
      if(c===c&&(!best||c>best.c))best={df:df,nf:nf,c:c};
    }catch(e){}
  }
  if(!best||best.c<0.3)throw fail('eCfg');
  return best;
}
let ortP=null,ortGpu=false;
function loadScript(u){return new Promise((res,rej)=>{const x=document.createElement('script');x.src=u;x.onload=res;x.onerror=()=>{x.remove();rej(new Error('load'));};document.head.appendChild(x);});}
function loadOrt(){
  if(window.ort)return Promise.resolve();

  return ortP||(ortP=(async()=>{

async function getModel(onP){
  for(const u of MODEL_URLS){
    try{
      let cache=null,r=null;
      if(window.caches){try{cache=await caches.open('sekat-v1');r=await cache.match(u);}catch(e){}}
      if(!r){r=await fetch(u);if(!r.ok)throw new Error('http');if(cache){try{await cache.put(u,r.clone());}catch(e){}}}
      const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0;
      for(;;){const x=await rd.read();if(x.done)break;parts.push(x.value);got+=x.value.length;onP(tot?got/tot:null,got);}
      return await new Blob(parts).arrayBuffer();
    }catch(e){}
  }
  throw fail('eNet');
}
async function aiSeparate(L,R,st){
  if(peakOf(L)<1e-4&&peakOf(R)<1e-4)throw fail('eSil');
  let buf;
  try{await loadOrt();ort.env.wasm.proxy=false;buf=await getModel((p,g)=>st('dlm',p,g));}
  catch(e){throw e.key?e:fail('eNet');}
  let last=null;
  for(const ep of(ortGpu?['webgpu','wasm']:['wasm'])){
    try{
      st('ldm');
      const sess=await ort.InferenceSession.create(new Uint8Array(buf),{executionProviders:[ep]});
      const inN=sess.inputNames[0],outN=sess.outputNames[0];
      const mk=df=>async x=>{const o=await sess.run({[inN]:new ort.Tensor('float32',x,[1,4,df,256])});return o[outN].data;};
      const cfg=await pickCfg(mk,L,R),pk=ep==='webgpu'?'procg':'proc';
      st(pk,0);
      const res=await processAI(L,R,{nf:cfg.nf,df:cfg.df,comp:1.035},mk(cfg.df),p=>st(pk,p));
      fit(res.music,1);fit(res.vocal,1);
      return res;
    }catch(e){last=e;}
  }

}
function pickMv(files){
  const arr=Array.isArray(files)?files:[];
  const key=f=>String((f&&(f.type||f.download||f.name||f.url))||'').toLowerCase();
  const isM=f=>/instr|no[ _-]?vocal|other|music/.test(key(f)),isV=f=>!isM(f)&&/vocal/.test(key(f));
  const v=arr.find(isV);let m=arr.find(isM);

  return v&&m&&v.url&&m.url?{vocal:v.url,music:m.url}:null;
}

async function mvsepSeparate(file,token,st){
  const PX=mvProxy(),API=PX+'/api/separation/';
  if(!PX)throw fail('eWorker');
  const fd=new FormData();fd.append('api_token',token);fd.append('audiofile',file,file.name);fd.append('sep_type','40');fd.append('output_format','1');
  st('mvup');
  let j;
  let r;try{r=await fetch(API+'create',{method:'POST',body:fd});}catch(e){throw fail('eProxy');}
  try{j=await r.json();}catch(e){const x=fail('eMv');x.detail='HTTP '+r.status;throw x;}
  if(!j||!j.success){const e=fail('eMv');e.detail=(j&&j.data&&j.data.message)||'';throw e;}
  const hash=j.data.hash;let files=null;
  for(let i=0;i<720&&!files;i++){
    await sleep(i?5000:2000);
    let g;try{g=await(await fetch(API+'get?hash='+encodeURIComponent(hash))).json();}catch(e){continue;}
    const s=g&&g.status;
    if(s==='done'){files=g.data&&g.data.files;break;}
    if(s==='failed'||s==='not_found'){const e=fail('eMv');e.detail=(g.data&&g.data.message)||s;throw e;}
    st(s==='waiting'?'mvq':'mvp');
  }
  const pk=pickMv(files);
  if(!pk){const e=fail('eMv');e.detail=files?'format':'timeout';throw e;}
  st('mvd');
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  try{
    const get=async u=>{const ab=await ctx.decodeAudioData(await(await fetch(PX+'/dl?url='+encodeURIComponent(u))).arrayBuffer());return{ch:Array.from({length:ab.numberOfChannels},(_,i)=>ab.getChannelData(i)),sr:ab.sampleRate};};
    const m=await get(pk.music),v=await get(pk.vocal);
    return{music:m.ch,vocal:v.ch,sr:m.sr};
  }catch(e){const x=fail('eMvf');x.links=[pk.music,pk.vocal];throw x;}
  finally{ctx.close();}
}

function loadLame(){

async function mp3(chs,sr){
  await loadLame();
  const c=chs.length,enc=new lamejs.Mp3Encoder(c,sr,192),out=[],B=1152;
  const I=chs.map(a=>{const r=new Int16Array(a.length);for(let i=0;i<a.length;i++){const s=clamp(a[i],-1,1);r[i]=s<0?s*32768:s*32767;}return r;});
  const n=I[0].length;
  for(let i=0,k=0;i<n;i+=B,k++){
    const l=I[0].subarray(i,i+B),b=c>1?enc.encodeBuffer(l,I[1].subarray(i,i+B)):enc.encodeBuffer(l);
    if(b.length)out.push(new Uint8Array(b));
    if(k%200===0){setStat('enc',i/n);await tick();}

  const f=enc.flush();if(f.length)out.push(new Uint8Array(f));
